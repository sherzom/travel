<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026财年Q3 费用预算达成看板</title>
<style>
  :root {
    --primary: #1a56db;
    --primary-light: #e8f0fe;
    --primary-dark: #1347b8;
    --bg: #f8fafc;
    --white: #ffffff;
    --border: #e2e8f0;
    --border-blue: #bfdbfe;
    --text: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --warn: #d97706;
    --warn-bg: #fffbeb;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 13px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 24px 16px;
  }

  .container { max-width: 100%; margin: 0 auto; }

  /* Header */
  .header {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 24px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 1.2rem; color: var(--primary); font-weight: 700; }
  .header .meta { font-size: 0.75rem; color: var(--text-muted); text-align: right; }

  /* Summary */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .summary-card {
    background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; text-align: center;
  }
  .summary-card .value { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
  .summary-card .label { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }
  .summary-card.alert .value { color: var(--red); }

  /* Table */
  .table-wrap {
    background: var(--white); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }

  /* Header row 1 - fee type groups */
  thead tr.group th {
    background: var(--primary);
    color: var(--white);
    padding: 8px 6px;
    font-weight: 600;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.2);
    font-size: 0.78rem;
  }
  thead tr.group th.name-col { text-align: left; padding-left: 12px; min-width: 120px; }

  /* Header row 2 - sub labels */
  thead tr.sub th {
    background: #2a6aea;
    color: rgba(255,255,255,0.85);
    padding: 6px 4px;
    font-weight: 500;
    text-align: center;
    font-size: 0.68rem;
    border-right: 1px solid rgba(255,255,255,0.15);
    white-space: nowrap;
  }
  thead tr.sub th.name-col { text-align: left; padding-left: 12px; }

  /* Body */
  tbody td {
    padding: 8px 6px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid #f1f5f9;
    vertical-align: middle;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  tbody td.name-col { text-align: left; padding-left: 12px; font-weight: 600; }
  tbody tr:hover { background: var(--primary-light); }

  /* Division group row */
  .division-row td {
    background: var(--primary-light);
    font-weight: 700;
    color: var(--primary-dark);
    border-bottom: 2px solid var(--border-blue);
  }
  .division-row td.name-col { font-size: 0.85rem; }

  /* Mini bar */
  .mini-bar {
    display: inline-block;
    width: 50px;
    height: 6px;
    background: #e2e8f0;
    border-radius: 3px;
    overflow: hidden;
    vertical-align: middle;
    margin-right: 4px;
  }
  .mini-bar-fill { height: 100%; border-radius: 3px; }
  .mini-bar-fill.normal { background: var(--primary); }
  .mini-bar-fill.warn { background: var(--warn); }
  .mini-bar-fill.over { background: var(--red); }

  .pct { font-size: 0.72rem; font-weight: 600; }
  .pct.normal { color: var(--primary); }
  .pct.warn { color: var(--warn); }
  .pct.over { color: var(--red); }
  .pct.pending { color: var(--text-muted); }

  .amount { font-size: 0.75rem; }
  .amount.over { color: var(--red); font-weight: 600; }

  /* Status tag */
  .tag {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 0.65rem;
    font-weight: 600;
  }
  .tag.ok { background: var(--green-bg); color: var(--green); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.over { background: var(--red-bg); color: var(--red); }
  .tag.pending { background: #f1f5f9; color: var(--text-muted); }

  .footer { text-align: center; padding: 14px 0; font-size: 0.7rem; color: var(--text-muted); }

  @media (max-width: 768px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>2026财年Q3 费用预算达成看板</h1>
    <div class="meta" id="metaInfo">预算数据：2026-10-15<br>实际数据：待更新</div>
  </div>

  <div class="summary" id="summaryRow"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr class="group" id="headerGroup"></tr>
        <tr class="sub" id="headerSub"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">造旺发展事业部 · 数据来源：签呈费用测算表</div>

</div>

<script>
const BUDGET_DATA = [
  { division: "乳品事业部", line: "乳品", coin: 35233895.93, gift: 4965558.84, discount: 4087154.13, offline: 512305.23, total: 44798914.13 },
  { division: "乳品事业部", line: "乳饮料", coin: 811681.77, gift: 407463.19, discount: 0, offline: 1189.69, total: 1220334.66 },
  { division: "糖果事业部", line: "奶糖", coin: 704698.56, gift: 173929.40, discount: 208513.90, offline: 24558.59, total: 1111700.45 },
  { division: "糖果事业部", line: "软糖", coin: 666270.41, gift: 224409.05, discount: 497969.83, offline: 31826.84, total: 1420476.12 },
  { division: "糖果事业部", line: "口泡", coin: 1233.35, gift: 186.87, discount: 224.25, offline: 0, total: 1644.47 },
  { division: "旺礼事业部", line: "旺礼", coin: 882264.14, gift: 2091378.77, discount: 736018.36, offline: 0, total: 3709661.27 },
  { division: "果冻事业部", line: "果冻", coin: 95554.88, gift: 14478.01, discount: 333996.10, offline: 305.08, total: 444334.07 },
  { division: "酒品事业部", line: "酒品", coin: 12631.34, gift: 226231.60, discount: 272.06, offline: 666106.14, total: 905241.14 },
  { division: "冰品事业部", line: "冰品", coin: 15000.00, gift: 44271.08, discount: 15000.00, offline: 0, total: 74271.08 },
  { division: "米果事业部", line: "米果", coin: 0, gift: 1584.67, discount: 10737.13, offline: 1712.85, total: 14034.65 },
  { division: "豆果事业部", line: "豆果", coin: 6205.82, gift: 940.28, discount: 31260.31, offline: 269.74, total: 38676.15 },
  { division: "旺健康创研事业部", line: "FixXBody", coin: 17203.78, gift: 32500.57, discount: 42873.62, offline: 25563.93, total: 118141.90 },
  { division: "旺健康创研事业部", line: "爱至尊", coin: 88483.25, gift: 17696.65, discount: 35393.30, offline: 0, total: 141573.20 },
  { division: "文宣品周边", line: "文宣品", coin: 997465.43, gift: 0, discount: 0, offline: 110829.49, total: 1108294.93 },
  { division: "文宣品周边", line: "周边", coin: 911897.08, gift: 0, discount: 0, offline: 101321.90, total: 1013218.98 },
];

const ACTUAL_DATA = {};

const FEES = [
  { key: 'total', label: '总费用' },
  { key: 'coin', label: '旺金币' },
  { key: 'gift', label: '赠品' },
  { key: 'discount', label: '折扣' },
  { key: 'offline', label: '线下' },
];

const SUBS = ['预算', '实际', '达成率', '状态'];

function fmt(v) {
  if (v >= 10000) return (v / 10000).toFixed(1) + '万';
  return v.toFixed(0);
}

function getStatus(pct, hasActual) {
  if (!hasActual) return { cls: 'pending', text: '—', barCls: '' };
  if (pct > 100) return { cls: 'over', text: '超', barCls: 'over' };
  if (pct > 80) return { cls: 'warn', text: '关注', barCls: 'warn' };
  return { cls: 'ok', text: '正常', barCls: 'normal' };
}

function render() {
  const groups = {};
  BUDGET_DATA.forEach(d => {
    if (!groups[d.division]) groups[d.division] = [];
    groups[d.division].push(d);
  });

  // Summary
  let totalBudget = 0, totalActual = 0, overCount = 0, actualCount = 0;
  Object.values(groups).forEach(items => {
    items.forEach(item => {
      totalBudget += item.total;
      const actual = ACTUAL_DATA[item.line];
      if (actual) {
        actualCount++;
        const aTotal = (actual.coin||0)+(actual.gift||0)+(actual.discount||0)+(actual.offline||0);
        totalActual += aTotal;
        if (aTotal > item.total) overCount++;
      }
    });
  });

  const totalPct = totalBudget > 0 && totalActual > 0 ? (totalActual / totalBudget * 100).toFixed(1) : '-';
  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card"><div class="value">¥${fmt(totalBudget)}</div><div class="label">Q3预算合计</div></div>
    <div class="summary-card"><div class="value">${actualCount > 0 ? '¥' + fmt(totalActual) : '-'}</div><div class="label">实际合计</div></div>
    <div class="summary-card"><div class="value">${totalPct}%</div><div class="label">总达成率</div></div>
    <div class="summary-card ${overCount > 0 ? 'alert' : ''}"><div class="value">${actualCount > 0 ? overCount + ' / ' + actualCount : '-'}</div><div class="label">超预算项数</div></div>
  `;

  // Headers
  let h1 = '<th class="name-col">事业部 / 线别</th>';
  let h2 = '<th class="name-col"></th>';
  FEES.forEach(f => {
    h1 += `<th colspan="4">${f.label}</th>`;
    SUBS.forEach(s => { h2 += `<th>${s}</th>`; });
  });
  document.getElementById('headerGroup').innerHTML = h1;
  document.getElementById('headerSub').innerHTML = h2;

  // Body
  let html = '';
  for (const [division, items] of Object.entries(groups)) {
    // Division total row
    html += `<tr class="division-row"><td class="name-col">${division}</td>`;
    for (const fee of FEES) {
      const budget = items.reduce((s, i) => s + (i[fee.key] || 0), 0);
      const actual = items.reduce((s, i) => {
        const a = ACTUAL_DATA[i.line]; return s + (a ? (a[fee.key] || 0) : 0);
      }, 0);
      const hasActual = items.some(i => ACTUAL_DATA[i.line]);
      const pct = budget > 0 && actual > 0 ? (actual / budget * 100) : 0;
      const st = getStatus(pct, hasActual);
      const barW = Math.min(pct, 100);

      html += `<td class="amount">${fmt(budget)}</td>`;
      html += `<td class="amount ${hasActual ? (actual > budget ? 'over' : '') : ''}">${hasActual ? fmt(actual) : '-'}</td>`;
      html += `<td>${hasActual ? `<span class="mini-bar"><span class="mini-bar-fill ${st.barCls}" style="width:${barW}%"></span></span><span class="pct ${st.cls}">${pct.toFixed(0)}%</span>` : '<span class="pct pending">—</span>'}</td>`;
      html += `<td><span class="tag ${st.cls}">${st.text}</span></td>`;
    }
    html += '</tr>';

    // Line rows
    for (const item of items) {
      const actual = ACTUAL_DATA[item.line];
      html += `<tr><td class="name-col" style="padding-left:24px">${item.line}</td>`;
      for (const fee of FEES) {
        const budget = item[fee.key] || 0;
        const actualVal = actual ? (actual[fee.key] || 0) : null;
        const hasActual = actualVal !== null;
        const pct = budget > 0 && hasActual ? (actualVal / budget * 100) : 0;
        const st = getStatus(pct, hasActual);
        const barW = Math.min(pct, 100);

        html += `<td class="amount">${fmt(budget)}</td>`;
        html += `<td class="amount ${hasActual ? (actualVal > budget ? 'over' : '') : ''}">${hasActual ? fmt(actualVal) : '-'}</td>`;
        html += `<td>${hasActual ? `<span class="mini-bar"><span class="mini-bar-fill ${st.barCls}" style="width:${barW}%"></span></span><span class="pct ${st.cls}">${pct.toFixed(0)}%</span>` : '<span class="pct pending">—</span>'}</td>`;
        html += `<td><span class="tag ${st.cls}">${st.text}</span></td>`;
      }
      html += '</tr>';
    }
  }

  document.getElementById('tableBody').innerHTML = html;

  const now = new Date().toLocaleDateString('zh-CN');
  document.getElementById('metaInfo').innerHTML =
    `预算数据：2026-10-15<br>实际数据：${actualCount > 0 ? '已更新 ' + now : '待更新'}`;
}

render();
</script>
</body>
</html>
