<!DOCTYPE html>

<style>
  :root {
    --primary: #1e40af;
    --primary-light: #eff6ff;
    --primary-dark: #1e3a8a;
    --accent: #dc2626;
    --accent-light: #fef2f2;
    --bg: #f1f5f9;
    --white: #ffffff;
    --border: #e2e8f0;
    --border-soft: #e2e8f0;
    --text: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 13px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 24px 20px;
  }

  .container { max-width: 100%; margin: 0 auto; }

  /* Header */
  .header {
    background: var(--primary-dark);
    border-radius: var(--radius);
    padding: 18px 24px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow-sm);
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-logo {
    height: 36px;
    width: auto;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .header h1 {
    font-size: 1.25rem;
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .header .meta { font-size: 0.72rem; color: rgba(255,255,255,0.8); text-align: right; }

  /* Summary - top cards */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 14px;
  }
  .summary-card {
    background: var(--white);
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 16px 18px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.25s, transform 0.25s;
  }
  .summary-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }
  .summary-card .value { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
  .summary-card .label { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }
  .summary-card.alert .value { color: var(--accent); }

  /* Executive summary - new row */
  .exec-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 14px;
  }
  .exec-card {
    background: var(--white);
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: var(--shadow-sm);
  }
  .exec-card .exec-label {
    font-size: 0.68rem;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .exec-card .exec-value {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
  }
  .exec-card .exec-diff {
    font-size: 0.72rem;
    font-weight: 600;
  }
  .exec-card .exec-diff.neg { color: var(--green); }
  .exec-card .exec-diff.pos { color: var(--red); }
  .exec-card .exec-diff.neutral { color: var(--text-muted); }

  /* Over-budget alert section */
  .over-section {
    background: var(--white);
    border: 1.5px solid #fecaca;
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 14px;
    box-shadow: 0 2px 12px rgba(239,68,68,0.06);
  }
  .over-section.ok-section {
    border-color: #86efac;
    box-shadow: 0 2px 12px rgba(34,197,94,0.06);
  }
  .over-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ok-section .over-title { color: #16a34a; }
  .over-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .over-table th {
    background: #fef2f2;
    color: var(--accent);
    padding: 7px 10px;
    text-align: center;
    font-weight: 600;
    border-bottom: 1px solid #fecaca;

  .ok-section .over-table th {

  /* Table */

  thead tr.group th {

    color: rgba(255,255,255,0.9);
    padding: 7px 4px;
    font-weight: 500;
    text-align: center;

  /* Division group row - clickable */
  .division-row td {

  .mini-bar {

    border-radius: 4px;

  .mini-bar-fill.fee-fast { background: linear-gradient(90deg, #f59e0b, #d97706); }

  .pct.cash-good { color: var(--green); }
  .pct.cash-bad { color: var(--red); }

  .pct.fee-fast { color: var(--warn); }
  .pct.fee-over { color: var(--red); }
  .pct.pending { color: var(--text-muted); }

  /* Stacked cost structure bar */
  .stacked-bar {
    display: inline-flex;
    width: 56px;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    vertical-align: middle;
    margin-left: 4px;

  .stacked-bar .seg-coin { background: #3b82f6; }
  .stacked-bar .seg-gift { background: #22c55e; }
  .stacked-bar .seg-discount { background: #f97316; }
  .stacked-bar .seg-offline { background: #8b5cf6; }

  .amount { font-size: 0.76rem; }
  .amount.over { color: var(--accent); font-weight: 700; }
  .amount.under { color: #94a3b8; }
  .diff-pos { color: var(--red); font-weight: 600; }
  .diff-neg { color: var(--green); }
  .diff-zero { color: var(--text-muted); }

  /* Status tag */
  .tag {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 12px;
    font-size: 0.63rem;
    font-weight: 600;
  }
  .tag.ok { background: var(--green-bg); color: var(--green); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.over { background: var(--accent-light); color: var(--accent); }
  .tag.pending { background: #f9fafb; color: var(--text-muted); }

  .footer {
    text-align: center;
    padding: 16px 0 8px;
    font-size: 0.68rem;
    color: var(--text-muted);
  }
  .footer .note {
    margin-top: 4px;
    font-size: 0.65rem;
    color: var(--text-muted);
    opacity: 0.8;
  }

  @media (max-width: 768px) {
    body { padding: 16px 10px; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .exec-summary { grid-template-columns: repeat(2, 1fr); }
    .header { flex-direction: column; gap: 8px; }
    .header .meta { text-align: center; }
  }
</style>
</head>

const ACTUAL_DATA = {

// ==================== CONFIG ====================
const QUARTER_START = new Date('2026-10-01');
const QUARTER_END = new Date('2026-12-31');

const FEES = [
  { key: 'cash', label: '现金业绩', type: 'revenue' },
  { key: 'total', label: '总费用', type: 'cost' },
  { key: 'coin', label: '旺金币', type: 'cost' },
  { key: 'gift', label: '赠品', type: 'cost' },
  { key: 'discount', label: '折扣', type: 'cost' },
  { key: 'offline', label: '线下', type: 'cost' },
];

const SUBS = ['预算', '实际', '剩余', '执行率'];
const FEE_NAMES = { cash: '现金业绩', coin: '旺金币', gift: '赠品', discount: '折扣', offline: '线下', total: '总费用' };

// ==================== HELPERS ====================
function calcTimeProgress() {
  const now = new Date();
  const total = QUARTER_END - QUARTER_START;
  const elapsed = now - QUARTER_START;
  return Math.max(0, Math.min(1, elapsed / total));
}

function fmt(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  if (Math.abs(v) >= 10000) return (v / 10000).toFixed(1) + '万';
  return v.toFixed(0);
}

function fmtDiff(v) {
  if (v === null || v === undefined || isNaN(v) || v === 0) return '—';
  const sign = v > 0 ? '+' : '';
  if (Math.abs(v) >= 10000) return sign + (v / 10000).toFixed(1) + '万';
  return sign + v.toFixed(0);
}

// Revenue (cash): higher is better. Compare against time progress.
function getRevenueStatus(pct, hasActual, timeProgress) {
  if (!hasActual || pct === 0) return 'pending';
  if (pct < timeProgress * 0.8) return 'bad';   // behind schedule
  if (pct > timeProgress * 1.2) return 'good';  // ahead of schedule
  return 'normal';
}

// Cost (fees): lower is better. Compare against time progress.
function getCostStatus(pct, hasActual, timeProgress) {
  if (!hasActual || pct === 0) return 'pending';
  if (pct > 1.0) return 'over';                  // over budget
  if (pct > timeProgress * 1.2) return 'fast';   // spending too fast
  return 'normal';
}

function getMiniBarClass(feeType, status) {
  if (feeType === 'revenue') {
    switch(status) {
      case 'good': return 'cash-good';
      case 'bad': return 'cash-bad';
      default: return 'cash-normal';
    }
  } else {
    switch(status) {
      case 'over': return 'fee-over';
      case 'fast': return 'fee-fast';
      default: return 'fee-normal';
    }
  }
}

function getPctClass(feeType, status) {
  if (feeType === 'revenue') {
    switch(status) {
      case 'good': return 'cash-good';
      case 'bad': return 'cash-bad';
      default: return 'cash-normal';
    }
  } else {
    switch(status) {
      case 'over': return 'fee-over';
      case 'fast': return 'fee-fast';
      default: return 'fee-normal';
    }
  }
}

function getTagClass(status) {
  switch(status) {
    case 'over': return 'over';
    case 'fast': return 'warn';
    case 'bad': return 'warn';
    case 'good': return 'ok';
    case 'pending': return 'pending';
    default: return 'ok';
  }
}

function getTagText(status) {
  switch(status) {
    case 'over': return '超支';
    case 'fast': return '偏快';
    case 'bad': return '落后';
    case 'good': return '超前';
    case 'pending': return '未启动';
    default: return '正常';
  }
}

// ==================== RENDER ====================
function render() {
  const timeProgress = calcTimeProgress();
  const groups = {};
  BUDGET_DATA.forEach(d => {
    if (!groups[d.division]) groups[d.division] = [];
    groups[d.division].push(d);
  });

  // ---- Calculate totals ----
  let totalBudget = 0, totalActual = 0;
  let cashBudget = 0, cashActual = 0;
  const overItems = [];

  Object.values(groups).forEach(items => {
    items.forEach(item => {
      totalBudget += item.total;
      cashBudget += item.cash;
      const actual = ACTUAL_DATA[item.line];
      if (actual) {
        totalActual += actual.total || 0;
        cashActual += actual.cash || 0;
        // 只预警"总费用"层面的超支
        const b = item.total || 0;
        const a = actual.total || 0;
        if (b > 0 && a > b) {
          overItems.push({
            line: item.line, division: item.division,
            budget: b, actual: a, diff: a - b,
            pct: ((a / b) * 100).toFixed(1)
          });
        }
      }
    });
  });

  // ---- Top summary cards ----
  const totalPct = totalBudget > 0 && totalActual > 0 ? (totalActual / totalBudget * 100).toFixed(1) : 0;
  const cashPct = cashBudget > 0 && cashActual > 0 ? (cashActual / cashBudget * 100).toFixed(1) : 0;
  const totalOver = totalActual > totalBudget;

  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card"><div class="value">¥${fmt(cashBudget)}</div><div class="label">Q3现金业绩预算</div></div>
    <div class="summary-card"><div class="value">¥${fmt(cashActual)}</div><div class="label">现金业绩实际 (${cashPct}%)</div></div>
    <div class="summary-card"><div class="value">¥${fmt(totalBudget)}</div><div class="label">Q3费用预算合计</div></div>
    <div class="summary-card ${totalOver ? 'alert' : ''}"><div class="value">¥${fmt(totalActual)}<span style="font-size:0.65rem;font-weight:500"> (${totalPct}%)</span></div><div class="label">Q3费用实际合计 ${totalOver ? '⚠ 超支' : ''}</div></div>
  `;

  // ---- Executive summary ----
  const feeDiff = (parseFloat(totalPct) - timeProgress * 100).toFixed(1);
  const cashDiff = (parseFloat(cashPct) - timeProgress * 100).toFixed(1);
  const feeDiffClass = parseFloat(feeDiff) > 0 ? 'pos' : 'neg';
  const cashDiffClass = parseFloat(cashDiff) < 0 ? 'pos' : 'neg'; // cash: negative = bad

  document.getElementById('execSummary').innerHTML = `
    <div class="exec-card">
      <div class="exec-label">📅 时间进度</div>
      <div class="exec-value">${(timeProgress * 100).toFixed(1)}%</div>
      <div class="exec-diff neutral">Q3 已过 ${Math.floor((new Date() - QUARTER_START) / 86400000)} 天</div>
    </div>
    <div class="exec-card">
      <div class="exec-label">💰 费用执行率</div>
      <div class="exec-value">${totalPct}%</div>
      <div class="exec-diff ${feeDiffClass}">较时间进度 ${parseFloat(feeDiff) > 0 ? '+' : ''}${feeDiff}pp</div>
    </div>
    <div class="exec-card">
      <div class="exec-label">📈 业绩达成率</div>
      <div class="exec-value">${cashPct}%</div>
      <div class="exec-diff ${cashDiffClass}">较时间进度 ${parseFloat(cashDiff) > 0 ? '+' : ''}${cashDiff}pp</div>
    </div>
    <div class="exec-card">
      <div class="exec-label">⚠️ 预警项数</div>
      <div class="exec-value">${overItems.length} 项</div>
      <div class="exec-diff ${overItems.length > 0 ? 'pos' : 'neg'}">${overItems.length > 0 ? '需关注超支' : '暂无超支'}</div>
    </div>
  `;

  // ---- Over-budget alert section ----
  let overHtml = '';
  if (overItems.length > 0) {
    overHtml = `
      <div class="over-section">
        <div class="over-title">⚠️ 超支预警 · 总费用超预算（共 ${overItems.length} 项）</div>
        <table class="over-table">
          <thead>
            <tr><th>事业部</th><th>线别</th><th>预算</th><th>实际</th><th>超支额</th><th>超支比例</th></tr>
          </thead>
          <tbody>
            ${overItems.map(item => `
              <tr>
                <td><span class="over-div">${item.division}</span></td>
                <td><span class="over-line">${item.line}</span></td>
                <td>${fmt(item.budget)}</td>
                <td class="over-amount">${fmt(item.actual)}</td>
                <td class="over-amount">+${fmt(item.diff)}</td>
                <td class="over-pct">${item.pct}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } else {
    overHtml = `
      <div class="over-section ok-section">
        <div class="over-title">✅ 总费用暂无超支，执行在预算内</div>
      </div>
    `;
  }
  document.getElementById('overSection').innerHTML = overHtml;

  // ---- Table headers ----
  const divisionOrder = Object.keys(groups);
  let h1 = '<th class="name-col">事业部 / 线别</th>';
  let h2 = '<th class="name-col"></th>';
  FEES.forEach(f => {
    h1 += `<th colspan="4">${f.label}</th>`;
    SUBS.forEach(s => { h2 += `<th>${s}</th>`; });
  });
  document.getElementById('headerGroup').innerHTML = h1;
  document.getElementById('headerSub').innerHTML = h2;

  // ---- Table body ----
  let html = '';
  for (const division of divisionOrder) {
    const items = groups[division];
    const divIndex = divisionOrder.indexOf(division);

    // Division total row
    html += `<tr class="division-row" id="div-row-${divIndex}" onclick="toggleRow(${divIndex})">`;
    html += `<td class="name-col"><span class="expand-arrow">▶</span> ${division}</td>`;

    for (const fee of FEES) {
      const budget = items.reduce((s, i) => s + (i[fee.key] || 0), 0);
      const actual = items.reduce((s, i) => {
        const a = ACTUAL_DATA[i.line]; return s + (a ? (a[fee.key] || 0) : 0);
      }, 0);
      const hasActual = items.some(i => ACTUAL_DATA[i.line]);
      const remain = hasActual ? budget - actual : 0; // 剩余预算
      const pct = budget > 0 && actual > 0 ? (actual / budget * 100) : 0;

      let status;
      if (fee.type === 'revenue') {
        status = getRevenueStatus(pct, hasActual, timeProgress);
      } else {
        status = getCostStatus(pct, hasActual, timeProgress);
      }

      const barW = Math.min(pct, 100);
      const barClass = getMiniBarClass(fee.type, status);
      const pctClass = getPctClass(fee.type, status);

      // 总费用列加堆叠结构条
      let stackedBar = '';
      if (fee.key === 'total' && hasActual) {
        const coinB = items.reduce((s, i) => s + (i.coin || 0), 0);
        const giftB = items.reduce((s, i) => s + (i.gift || 0), 0);
        const discB = items.reduce((s, i) => s + (i.discount || 0), 0);
        const offB = items.reduce((s, i) => s + (i.offline || 0), 0);
        const tot = coinB + giftB + discB + offB;
        if (tot > 0) {
          stackedBar = `<span class="stacked-bar" title="旺金币 ${(coinB/tot*100).toFixed(0)}% · 赠品 ${(giftB/tot*100).toFixed(0)}% · 折扣 ${(discB/tot*100).toFixed(0)}% · 线下 ${(offB/tot*100).toFixed(0)}%">
            <span class="seg seg-coin" style="width:${(coinB/tot*100)}%"></span>
            <span class="seg seg-gift" style="width:${(giftB/tot*100)}%"></span>
            <span class="seg seg-discount" style="width:${(discB/tot*100)}%"></span>
            <span class="seg seg-offline" style="width:${(offB/tot*100)}%"></span>
          </span>`;
        }
      }

      html += `<td class="amount">${fmt(budget)}</td>`;
      html += `<td class="amount ${remain < 0 ? 'over' : ''}">${hasActual ? fmt(actual) + stackedBar : '—'}</td>`;
      html += `<td class="amount">${hasActual ? `<span class="${remain > 0 ? 'diff-neg' : remain < 0 ? 'diff-pos' : 'diff-zero'}">${fmtDiff(remain)}</span>` : '—'}</td>`;
      html += `<td>${hasActual ? `<span class="mini-bar"><span class="mini-bar-fill ${barClass}" style="width:${barW}%"></span></span><span class="pct ${pctClass}">${pct.toFixed(0)}%</span>` : '<span class="tag pending">未启动</span>'}</td>`;
    }
    html += '</tr>';

    // Line detail rows (hidden by default)
    for (const item of items) {
      const actual = ACTUAL_DATA[item.line];
      const hasActual = !!actual;
      html += `<tr class="line-row" id="line-${divIndex}">`;
      html += `<td class="name-col" style="padding-left:36px; font-weight:500; font-size:0.8rem;">${item.line}</td>`;

      for (const fee of FEES) {
        const budget = item[fee.key] || 0;
        const actualVal = actual ? (actual[fee.key] || 0) : 0;
        const lineHasActual = actual && actual[fee.key] !== undefined && actual[fee.key] > 0;
        const remain = lineHasActual ? budget - actualVal : 0; // 剩余预算
        const pct = budget > 0 && lineHasActual ? (actualVal / budget * 100) : 0;

        let status;
        if (fee.type === 'revenue') {
          status = getRevenueStatus(pct, lineHasActual, timeProgress);
        } else {
          status = getCostStatus(pct, lineHasActual, timeProgress);
        }

        const barW = Math.min(pct, 100);
        const barClass = getMiniBarClass(fee.type, status);
        const pctClass = getPctClass(fee.type, status);

        html += `<td class="amount">${fmt(budget)}</td>`;
        html += `<td class="amount ${remain < 0 ? 'over' : ''}">${lineHasActual ? fmt(actualVal) : '—'}</td>`;
        html += `<td class="amount">${lineHasActual ? `<span class="${remain > 0 ? 'diff-neg' : remain < 0 ? 'diff-pos' : 'diff-zero'}">${fmtDiff(remain)}</span>` : '—'}</td>`;
        html += `<td>${lineHasActual ? `<span class="mini-bar"><span class="mini-bar-fill ${barClass}" style="width:${barW}%"></span></span><span class="pct ${pctClass}">${pct.toFixed(0)}%</span>` : '<span class="tag pending">—</span>'}</td>`;
      }
      html += '</tr>';
    }
  }

  document.getElementById('tableBody').innerHTML = html;

  // ---- Meta info ----
  const now = new Date().toLocaleDateString('zh-CN');
  document.getElementById('metaInfo').innerHTML =
    `预算数据：2026-10-15<br>实际数据：${totalActual > 0 ? '已更新 ' + now : '待更新'}`;

  // ---- Footer note ----
  document.getElementById('footerNote').innerHTML =
    `* 执行率基准：Q3时间进度 ${(timeProgress * 100).toFixed(1)}%；超支判定：实际 > 预算`;
}

// ==================== INTERACTION ====================
let allExpanded = false;

function toggleRow(divIndex) {
  const row = document.getElementById(`div-row-${divIndex}`);
  const lines = document.querySelectorAll(`#line-${divIndex}`);
  row.classList.toggle('expanded');
  lines.forEach(l => l.classList.toggle('show'));
}

function toggleAll() {
  allExpanded = !allExpanded;
  document.querySelectorAll('.division-row').forEach((row, i) => {
    if (allExpanded) {
      row.classList.add('expanded');
    } else {
      row.classList.remove('expanded');
    }
  });
  document.querySelectorAll('.line-row').forEach(line => {
    if (allExpanded) {
      line.classList.add('show');
    } else {
      line.classList.remove('show');
    }
  });
  document.getElementById('toggleAllBtn').textContent = allExpanded ? '全部收起' : '全部展开';
}

render();
</script>
</body>
</html>
