<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026财年Q3 费用预算达成看板</title>
<style>
  :root {
    --primary: #3b82f6;
    --primary-light: #eff6ff;
    --primary-dark: #1d4ed8;
    --accent: #fb7185;
    --accent-light: #fff1f2;
    --bg: #fef7f0;
    --white: #ffffff;
    --border: #fde4e4;
    --border-soft: #f3e8e8;
    --text: #374151;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --green: #22c55e;
    --green-bg: #f0fdf4;
    --red: #ef4444;
    --red-bg: #fef2f2;
    --warn: #f59e0b;
    --warn-bg: #fffbeb;
    --shadow-sm: 0 2px 8px rgba(59,130,246,0.06);
    --shadow-md: 0 4px 16px rgba(59,130,246,0.1);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 13px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: linear-gradient(160deg, #fef7f0 0%, #fff1f2 30%, #eff6ff 70%, #fef7f0 100%);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 28px 20px;
  }

  .container { max-width: 100%; margin: 0 auto; }

  /* Header */
  .header {
    background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
    border-radius: var(--radius);
    padding: 20px 28px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(59,130,246,0.15);
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-logo {
    height: 36px;
    width: auto;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .header h1 {
    font-size: 1.25rem;
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .header .meta { font-size: 0.72rem; color: rgba(255,255,255,0.8); text-align: right; }

  /* Summary */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 16px;
  }
  .summary-card {
    background: var(--white);
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 16px 18px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.25s, transform 0.25s;
  }
  .summary-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }
  .summary-card .value { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
  .summary-card .label { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }
  .summary-card.alert .value { color: var(--accent); }

  /* Table */
  .table-wrap {
    background: var(--white);
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius);
    overflow-x: auto;
    box-shadow: var(--shadow-sm);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }

  /* Header row 1 - fee type groups */
  thead tr.group th {
    background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
    color: var(--white);
    padding: 12px 6px;
    font-weight: 600;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.2);
    font-size: 0.78rem;
    letter-spacing: 0.3px;
  }
  thead tr.group th.name-col { text-align: left; padding-left: 16px; min-width: 130px; }

  /* Header row 2 - sub labels */
  thead tr.sub th {
    background: #6366f1;
    color: rgba(255,255,255,0.92);
    padding: 8px 4px;
    font-weight: 500;
    text-align: center;
    font-size: 0.68rem;
    border-right: 1px solid rgba(255,255,255,0.15);
    white-space: nowrap;
  }
  thead tr.sub th.name-col { text-align: left; padding-left: 16px; }

  /* Body */
  tbody td {
    padding: 11px 8px;
    text-align: center;
    border-bottom: 1px solid #f3e8e8;
    border-right: 1px solid #faf5f5;
    vertical-align: middle;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    font-size: 0.82rem;
  }
  tbody td.name-col { text-align: left; padding-left: 16px; font-weight: 600; font-size: 0.85rem; }
  tbody tr:hover { background: #fef7ff; }
  tbody tr.line-row:nth-child(even) { background: #fefcfc; }
  tbody tr.line-row:nth-child(even):hover { background: #fef7ff; }

  /* Division group row */
  .division-row td {
    background: linear-gradient(90deg, #fff1f2 0%, #eff6ff 100%);
    font-weight: 700;
    color: var(--primary-dark);
    border-bottom: 2px solid #fde4e4;
    border-top: 2px solid #fde4e4;
    font-size: 0.84rem;
    padding: 12px 8px;
  }
  .division-row td.name-col { font-size: 0.88rem; }

  /* Mini bar */
  .mini-bar {
    display: inline-block;
    width: 48px;
    height: 6px;
    background: #fde4e4;
    border-radius: 4px;
    overflow: hidden;
    vertical-align: middle;
    margin-right: 5px;
  }
  .mini-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .mini-bar-fill.normal { background: linear-gradient(90deg, #3b82f6, #6366f1); }
  .mini-bar-fill.warn { background: var(--warn); }
  .mini-bar-fill.over { background: var(--accent); }

  .pct { font-size: 0.72rem; font-weight: 600; }
  .pct.normal { color: var(--primary); }
  .pct.warn { color: var(--warn); }
  .pct.over { color: var(--accent); }
  .pct.pending { color: var(--text-muted); }

  .amount { font-size: 0.78rem; }
  .amount.over { color: var(--accent); font-weight: 700; }
  .amount.under { color: #94a3b8; }

  /* Status tag */
  .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.65rem;
    font-weight: 600;
  }
  .tag.ok { background: var(--green-bg); color: var(--green); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.over { background: var(--accent-light); color: var(--accent); }
  .tag.pending { background: #f9fafb; color: var(--text-muted); }

  .tax-note {
    background: linear-gradient(90deg, #fff1f2 0%, #eff6ff 100%);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.75rem;
    color: var(--primary-dark);
    text-align: center;
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }

  /* Over-budget section */
  .over-section {
    background: var(--white);
    border: 1.5px solid #fecaca;
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(239,68,68,0.06);
  }
  .over-title {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .over-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  .over-table th {
    background: #fef2f2;
    color: var(--accent);
    padding: 8px 12px;
    text-align: center;
    font-weight: 600;
    border-bottom: 1px solid #fecaca;
  }
  .over-table td {
    padding: 8px 12px;
    text-align: center;
    border-bottom: 1px solid #fef3f3;
    font-variant-numeric: tabular-nums;
  }
  .over-table .over-line { font-weight: 700; color: var(--text); }
  .over-table .over-div { font-size: 0.7rem; color: var(--text-muted); margin-left: 6px; }
  .over-table .over-amount { color: var(--accent); font-weight: 700; }
  .over-table .over-pct { color: var(--accent); font-weight: 600; }
  .over-table .over-sum td { border-top: 2px solid #fecaca; font-weight: 700; background: #fffbfb; }
  .over-table .over-fee { display: inline-block; padding: 1px 6px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; background: #fef2f2; color: var(--accent); }
  .ok-section { border-color: #86efac !important; padding: 14px 22px !important; }
  .ok-title { color: #16a34a !important; }

  .footer { text-align: center; padding: 16px 0; font-size: 0.7rem; color: var(--text-muted); }

  @media (max-width: 768px) {
    body { padding: 16px 10px; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .header { flex-direction: column; gap: 8px; }
    .header .meta { text-align: center; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-title">
      <img src="https://sherzom.github.io/travel/1024.png" alt="logo" class="header-logo">
      <h1>2026财年Q3 费用预算达成看板</h1>
    </div>
    <div class="meta" id="metaInfo">预算数据：2026-10-15<br>实际数据：待更新</div>
  </div>

  <div class="summary" id="summaryRow"></div>

  <div class="tax-note">所有金额均为含税金额（业绩 & 费用）</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr class="group" id="headerGroup"></tr>
        <tr class="sub" id="headerSub"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">造旺发展事业部 · 数据来源：签呈费用测算表</div>

</div>

<script>
const BUDGET_DATA = [
  { division: "乳品事业部", line: "乳品", cash: 124201799.05, coin: 35233895.93, gift: 4965558.84, discount: 4087154.13, offline: 512305.23, total: 44798914.13 },
  { division: "乳品事业部", line: "乳饮料", cash: 2716421.30, coin: 811681.77, gift: 407463.19, discount: 0, offline: 1189.69, total: 1220334.66 },
  { division: "糖果事业部", line: "奶糖", cash: 7310079.81, coin: 704698.56, gift: 173929.40, discount: 208513.90, offline: 24558.59, total: 1111700.45 },
  { division: "糖果事业部", line: "软糖", cash: 7252849.47, coin: 666270.41, gift: 224409.05, discount: 497969.83, offline: 31826.84, total: 1420476.12 },
  { division: "糖果事业部", line: "口泡", cash: 7474.85, coin: 1233.35, gift: 186.87, discount: 224.25, offline: 0, total: 1644.47 },
  { division: "旺礼事业部", line: "旺礼", cash: 18804037.91, coin: 882264.14, gift: 2091378.77, discount: 736018.36, offline: 0, total: 3709661.27 },
  { division: "果冻事业部", line: "果冻", cash: 585222.10, coin: 95554.88, gift: 14478.01, discount: 333996.10, offline: 305.08, total: 444334.07 },
  { division: "酒品事业部", line: "酒品", cash: 1596658.56, coin: 12631.34, gift: 226231.60, discount: 272.06, offline: 666106.14, total: 905241.14 },
  { division: "冰品事业部", line: "冰品", cash: 150000.00, coin: 15000.00, gift: 44271.08, discount: 15000.00, offline: 0, total: 74271.08 },
  { division: "米果事业部", line: "米果", cash: 32144.08, coin: 0, gift: 1584.67, discount: 10737.13, offline: 1712.85, total: 14034.65 },
  { division: "豆果事业部", line: "豆果", cash: 43005.92, coin: 6205.82, gift: 940.28, discount: 31260.31, offline: 269.74, total: 38676.15 },
  { division: "旺健康创研事业部", line: "FixXBody", cash: 271373.94, coin: 17203.78, gift: 32500.57, discount: 42873.62, offline: 25563.93, total: 118141.90 },
  { division: "旺健康创研事业部", line: "爱至尊", cash: 353933.01, coin: 88483.25, gift: 17696.65, discount: 35393.30, offline: 0, total: 141573.20 },
  { division: "文创事业部", line: "文宣品", cash: 0, coin: 997465.43, gift: 0, discount: 0, offline: 110829.49, total: 1108294.93 },
  { division: "文创事业部", line: "周边", cash: 0, coin: 911897.08, gift: 0, discount: 0, offline: 101321.90, total: 1013218.98 },
];

const ACTUAL_DATA = {
  "FixXBody": { cash: 36720, coin: 514.8, discount: 103680, gift: 0, offline: 0, total: 104194.8 },
  "爱至尊": { cash: 0, coin: 5645.25, discount: 0, gift: 0, offline: 0, total: 5645.25 },
  "冰品": { cash: 3588, coin: 300, discount: 0, gift: 1142.4, offline: 60, total: 1502.4 },
  "果冻": { cash: 16908.48, coin: 3906.46, discount: 278.21, gift: 2854.8, offline: 0, total: 7039.47 },
  "酒品": { cash: 77480.4, coin: 796.2, discount: 5076, gift: 2574, offline: 57551.72, total: 65991.92 },
  "米果": { cash: 0, coin: 0, discount: 0, gift: 0, offline: 790.5, total: 790.5 },
  "奶糖": { cash: 1213908.39, coin: 85632.46, discount: 28644.95, gift: 28902, offline: 9140.33, total: 152319.74 },
  "乳品": { cash: 8348098.59, coin: 2120060.16, discount: 4138090.58, gift: 314357.25, offline: 27549.3, total: 6600057.29 },
  "乳饮料": { cash: 80679.15, coin: 18670.1, discount: 0, gift: 4777.5, offline: 0, total: 23447.6 },
  "软糖": { cash: 1314234.84, coin: 95577.23, discount: 65146.93, gift: 29674.4, offline: 10874.66, total: 200273.22 },
  "旺礼": { cash: 0, coin: 11654.48, discount: 0, gift: 0, offline: 42323.84, total: 53978.32 },
  "文宣品": { cash: 0, coin: 174316.2, discount: 0, gift: 0, offline: 278, total: 174594.2 },
  "周边": { cash: 0, coin: 190885.35, discount: 0, gift: 0, offline: 504, total: 191389.35 },
  "豆果": { cash: 17092.24, coin: 5651.15, discount: 384.11, gift: 0, offline: 0, total: 6035.26 },
};

const FEES = [
  { key: 'cash', label: '现金业绩' },
  { key: 'total', label: '总费用' },
  { key: 'coin', label: '旺金币' },
  { key: 'gift', label: '赠品' },
  { key: 'discount', label: '折扣' },
  { key: 'offline', label: '线下' },
];

const SUBS = ['预算', '实际', '差异', '超出', '达成率'];

function fmt(v) {
  if (Math.abs(v) >= 10000) return (v / 10000).toFixed(1) + '万';
  return v.toFixed(0);
}

function fmtDiff(v) {
  if (v === 0) return '—';
  const sign = v > 0 ? '+' : '';
  if (Math.abs(v) >= 10000) return sign + (v / 10000).toFixed(1) + '万';
  return sign + v.toFixed(0);
}

function render() {
  const groups = {};
  BUDGET_DATA.forEach(d => {
    if (!groups[d.division]) groups[d.division] = [];
    groups[d.division].push(d);
  });

  // Summary
  let totalBudget = 0, totalActual = 0, totalDiff = 0;
  let cashBudget = 0, cashActual = 0;
  const overItems = []; // {line, fee, feeName, budget, actual, diff, pct}
  const FEE_NAMES = { cash: '现金业绩', coin: '旺金币', gift: '赠品', discount: '折扣', offline: '线下', total: '总费用' };
  const feeKeys = ['coin', 'gift', 'discount', 'offline'];

  Object.values(groups).forEach(items => {
    items.forEach(item => {
      totalBudget += item.total;
      cashBudget += item.cash;
      const actual = ACTUAL_DATA[item.line];
      if (actual) {
        totalActual += actual.total || 0;
        cashActual += actual.cash || 0;
        // Check each fee type for over-budget
        for (const fee of feeKeys) {
          const b = item[fee] || 0;
          const a = actual[fee] || 0;
          if (b > 0 && a > b) {
            overItems.push({
              line: item.line, division: item.division,
              fee: fee, feeName: FEE_NAMES[fee],
              budget: b, actual: a, diff: a - b, pct: ((a / b) * 100 - 100).toFixed(1)
            });
          }
        }
      }
    });
  });
  totalDiff = totalActual - totalBudget;

  const totalPct = totalBudget > 0 && totalActual > 0 ? (totalActual / totalBudget * 100).toFixed(1) : '-';
  const cashPct = cashBudget > 0 && cashActual > 0 ? (cashActual / cashBudget * 100).toFixed(1) : '-';
  const overTotal = overItems.reduce((s, o) => s + o.diff, 0);
  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card"><div class="value">¥${fmt(cashBudget)}</div><div class="label">Q3现金业绩预算</div></div>
    <div class="summary-card"><div class="value">¥${fmt(cashActual)}</div><div class="label">现金业绩实际 (${cashPct}%)</div></div>
    <div class="summary-card"><div class="value">¥${fmt(totalBudget)}</div><div class="label">Q3费用预算合计</div></div>
    <div class="summary-card ${overTotal > 0 ? 'alert' : ''}"><div class="value" style="color:${overTotal > 0 ? 'var(--accent)' : 'var(--primary)'}">${overTotal > 0 ? '⚠ 超 ¥' + fmt(overTotal) : '✅ 未超支'}</div><div class="label">费用超支金额 ${overTotal > 0 ? '(' + overItems.length + '项)' : ''}</div></div>
  `;

  // Sort divisions: over-budget first
  const sortedGroups = {};
  const overDivisions = new Set(overItems.map(o => o.division));
  const divisionOrder = Object.keys(groups).sort((a, b) => {
    const aOver = overDivisions.has(a) ? 0 : 1;
    const bOver = overDivisions.has(b) ? 0 : 1;
    return aOver - bOver;
  });

  // Headers
  let h1 = '<th class="name-col">事业部 / 线别</th>';
  let h2 = '<th class="name-col"></th>';
  FEES.forEach(f => {
    h1 += `<th colspan="5">${f.label}</th>`;
    SUBS.forEach(s => { h2 += `<th>${s}</th>`; });
  });
  document.getElementById('headerGroup').innerHTML = h1;
  document.getElementById('headerSub').innerHTML = h2;

  // Body
  let html = '';
  for (const division of divisionOrder) {
    const items = groups[division];
    // Division total row
    html += `<tr class="division-row"><td class="name-col">${division}</td>`;
    for (const fee of FEES) {
      const budget = items.reduce((s, i) => s + (i[fee.key] || 0), 0);
      const actual = items.reduce((s, i) => {
        const a = ACTUAL_DATA[i.line]; return s + (a ? (a[fee.key] || 0) : 0);
      }, 0);
      const hasActual = items.some(i => ACTUAL_DATA[i.line]);
      const diff = hasActual ? actual - budget : 0;
      const pct = budget > 0 && actual > 0 ? (actual / budget * 100) : 0;
      const barW = Math.min(pct, 100);
      const isOver = hasActual && actual > budget;

      html += `<td class="amount">${fmt(budget)}</td>`;
      html += `<td class="amount ${isOver ? 'over' : ''}">${hasActual ? fmt(actual) : '—'}</td>`;
      html += `<td class="amount ${isOver ? 'over' : (hasActual && diff < 0 ? 'under' : '')}">${hasActual ? fmtDiff(diff) : '—'}</td>`;
      html += `<td class="amount ${isOver ? 'over' : ''}">${isOver ? '+' + fmt(diff) : '—'}</td>`;
      html += `<td>${hasActual ? `<span class="mini-bar"><span class="mini-bar-fill ${isOver ? 'over' : (pct > 80 ? 'warn' : 'normal')}" style="width:${barW}%"></span></span><span class="pct ${isOver ? 'over' : (pct > 80 ? 'warn' : 'normal')}">${pct.toFixed(0)}%</span>` : '<span class="pct pending">—</span>'}</td>`;
    }
    html += '</tr>';

    // Line rows
    for (const item of items) {
      const actual = ACTUAL_DATA[item.line];
      html += `<tr class="line-row"><td class="name-col">${item.line}</td>`;
      for (const fee of FEES) {
        const budget = item[fee.key] || 0;
        const actualVal = actual ? (actual[fee.key] || 0) : 0;
        const hasActual = actual && actual[fee.key] !== undefined;
        const diff = hasActual ? actualVal - budget : 0;
        const pct = budget > 0 && hasActual ? (actualVal / budget * 100) : 0;
        const barW = Math.min(pct, 100);
        const isOver = hasActual && actualVal > budget;

        html += `<td class="amount">${fmt(budget)}</td>`;
        html += `<td class="amount ${isOver ? 'over' : ''}">${hasActual ? fmt(actualVal) : '—'}</td>`;
        html += `<td class="amount ${isOver ? 'over' : (hasActual && diff < 0 ? 'under' : '')}">${hasActual ? fmtDiff(diff) : '—'}</td>`;
        html += `<td>${hasActual ? `<span class="mini-bar"><span class="mini-bar-fill ${isOver ? 'over' : (pct > 80 ? 'warn' : 'normal')}" style="width:${barW}%"></span></span><span class="pct ${isOver ? 'over' : (pct > 80 ? 'warn' : 'normal')}">${pct.toFixed(0)}%</span>` : '<span class="pct pending">—</span>'}</td>`;
      }
      html += '</tr>';
    }
  }

  document.getElementById('tableBody').innerHTML = html;

  const now = new Date().toLocaleDateString('zh-CN');
  document.getElementById('metaInfo').innerHTML =
    `预算数据：2026-10-15<br>实际数据：${totalActual > 0 ? '已更新 ' + now : '待更新'}`;
}

render();
</script>
</body>
</html>
