<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026财年Q3 费用预算达成看板</title>
<style>
  :root {
    --primary: #1a56db;
    --primary-light: #e8f0fe;
    --primary-dark: #1347b8;
    --bg: #f8fafc;
    --white: #ffffff;
    --border: #e2e8f0;
    --border-blue: #bfdbfe;
    --text: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --orange: #ea580c;
    --orange-bg: #fff7ed;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --warn: #d97706;
    --warn-bg: #fffbeb;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 14px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 24px 16px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 {
    font-size: 1.25rem;
    color: var(--primary);
    font-weight: 700;
  }
  .header .meta {
    font-size: 0.8rem;
    color: var(--text-muted);
    text-align: right;
  }

  /* Summary Row */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .summary-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    text-align: center;
  }
  .summary-card .value {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--primary);
  }
  .summary-card .label {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .summary-card.alert .value { color: var(--red); }
  .summary-card.warn .value { color: var(--warn); }

  /* Table */
  .table-wrap {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  thead {
    background: var(--primary);
    color: var(--white);
  }
  thead th {
    padding: 10px 12px;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    font-size: 0.8rem;
  }
  thead th.left { text-align: left; }
  tbody td {
    padding: 10px 12px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    white-space: nowrap;
  }
  tbody td.left { text-align: left; }
  tbody tr:hover { background: var(--primary-light); }
  tbody tr:last-child td { border-bottom: none; }

  /* Division group row */
  .division-row td {
    background: var(--primary-light);
    font-weight: 700;
    color: var(--primary-dark);
    border-bottom: 2px solid var(--border-blue);
    font-size: 0.85rem;
  }

  /* Bar in cell */
  .bar-cell {
    position: relative;
    min-width: 100px;
  }
  .bar-bg {
    position: absolute;
    left: 8px;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    height: 18px;
    background: #f1f5f9;
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }
  .bar-fill.normal { background: var(--primary); }
  .bar-fill.warn { background: var(--warn); }
  .bar-fill.over { background: var(--red); }
  .bar-text {
    position: relative;
    z-index: 1;
    font-weight: 600;
    font-size: 0.78rem;
  }
  .bar-text.normal { color: var(--white); padding: 0 6px; }
  .bar-text.warn { color: var(--white); padding: 0 6px; }
  .bar-text.over { color: var(--white); padding: 0 6px; }

  /* Status badges */
  .status {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 600;
  }
  .status.ok { background: var(--green-bg); color: var(--green); }
  .status.warn { background: var(--warn-bg); color: var(--warn); }
  .status.over { background: var(--red-bg); color: var(--red); }
  .status.pending { background: #f1f5f9; color: var(--text-muted); }

  /* Amount styling */
  .amount { font-variant-numeric: tabular-nums; }
  .amount.over { color: var(--red); font-weight: 600; }
  .amount.ok { color: var(--text); }

  /* Footer */
  .footer {
    text-align: center;
    padding: 16px 0;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .table-wrap { overflow-x: auto; }
    table { min-width: 900px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>2026财年Q3 费用预算达成看板</h1>
    <div class="meta" id="metaInfo">预算数据：2026-10-15<br>实际数据：待更新</div>
  </div>

  <div class="summary" id="summaryRow"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="left" style="width:140px">事业部/线别</th>
          <th>费用类型</th>
          <th style="min-width:110px">预算金额</th>
          <th style="min-width:110px">实际金额</th>
          <th style="min-width:140px">达成率</th>
          <th>状态</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">造旺发展事业部 · 数据来源：签呈费用测算表</div>

</div>

<script>
const BUDGET_DATA = [
  { division: "乳品事业部", line: "乳品", coin: 35233895.93, gift: 4965558.84, discount: 4087154.13, offline: 512305.23, total: 44798914.13 },
  { division: "乳品事业部", line: "乳饮料", coin: 811681.77, gift: 407463.19, discount: 0, offline: 1189.69, total: 1220334.66 },
  { division: "糖果事业部", line: "奶糖", coin: 704698.56, gift: 173929.40, discount: 208513.90, offline: 24558.59, total: 1111700.45 },
  { division: "糖果事业部", line: "软糖", coin: 666270.41, gift: 224409.05, discount: 497969.83, offline: 31826.84, total: 1420476.12 },
  { division: "糖果事业部", line: "口泡", coin: 1233.35, gift: 186.87, discount: 224.25, offline: 0, total: 1644.47 },
  { division: "旺礼事业部", line: "旺礼", coin: 882264.14, gift: 2091378.77, discount: 736018.36, offline: 0, total: 3709661.27 },
  { division: "果冻事业部", line: "果冻", coin: 95554.88, gift: 14478.01, discount: 333996.10, offline: 305.08, total: 444334.07 },
  { division: "酒品事业部", line: "酒品", coin: 12631.34, gift: 226231.60, discount: 272.06, offline: 666106.14, total: 905241.14 },
  { division: "冰品事业部", line: "冰品", coin: 15000.00, gift: 44271.08, discount: 15000.00, offline: 0, total: 74271.08 },
  { division: "米果事业部", line: "米果", coin: 0, gift: 1584.67, discount: 10737.13, offline: 1712.85, total: 14034.65 },
  { division: "豆果事业部", line: "豆果", coin: 6205.82, gift: 940.28, discount: 31260.31, offline: 269.74, total: 38676.15 },
  { division: "旺健康创研事业部", line: "FixXBody", coin: 17203.78, gift: 32500.57, discount: 42873.62, offline: 25563.93, total: 118141.90 },
  { division: "旺健康创研事业部", line: "爱至尊", coin: 88483.25, gift: 17696.65, discount: 35393.30, offline: 0, total: 141573.20 },
  { division: "文宣品周边", line: "文宣品", coin: 997465.43, gift: 0, discount: 0, offline: 110829.49, total: 1108294.93 },
  { division: "文宣品周边", line: "周边", coin: 911897.08, gift: 0, discount: 0, offline: 101321.90, total: 1013218.98 },
];

const ACTUAL_DATA = {};

const FEE_TYPES = [
  { key: 'total', label: '总费用' },
  { key: 'coin', label: '旺金币' },
  { key: 'gift', label: '赠品' },
  { key: 'discount', label: '折扣' },
  { key: 'offline', label: '线下' },
];

function fmt(v) {
  return v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getStatus(pct, hasActual) {
  if (!hasActual) return { cls: 'pending', text: '待录入', barCls: '' };
  if (pct > 100) return { cls: 'over', text: '超预算', barCls: 'over' };
  if (pct > 80) return { cls: 'warn', text: '关注', barCls: 'warn' };
  return { cls: 'ok', text: '正常', barCls: 'normal' };
}

function render() {
  const groups = {};
  BUDGET_DATA.forEach(d => {
    if (!groups[d.division]) groups[d.division] = [];
    groups[d.division].push(d);
  });

  // Summary
  let totalBudget = 0, totalActual = 0, overCount = 0, actualCount = 0;
  Object.values(groups).forEach(items => {
    items.forEach(item => {
      totalBudget += item.total;
      const actual = ACTUAL_DATA[item.line];
      if (actual) {
        actualCount++;
        const aTotal = (actual.coin||0) + (actual.gift||0) + (actual.discount||0) + (actual.offline||0);
        totalActual += aTotal;
        if (aTotal > item.total) overCount++;
      }
    });
  });

  const totalPct = totalBudget > 0 && totalActual > 0 ? (totalActual / totalBudget * 100).toFixed(1) : '-';
  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card">
      <div class="value">¥${(totalBudget/10000).toFixed(0)}万</div>
      <div class="label">Q3预算合计</div>
    </div>
    <div class="summary-card ${actualCount > 0 ? '' : 'warn'}">
      <div class="value">${actualCount > 0 ? '¥' + (totalActual/10000).toFixed(0) + '万' : '-'}</div>
      <div class="label">实际合计</div>
    </div>
    <div class="summary-card ${actualCount > 0 ? '' : 'warn'}">
      <div class="value">${totalPct}%</div>
      <div class="label">总达成率</div>
    </div>
    <div class="summary-card ${overCount > 0 ? 'alert' : ''}">
      <div class="value">${actualCount > 0 ? overCount : '-'}</div>
      <div class="label">超预算项 / ${actualCount}</div>
    </div>
  `;

  // Table
  let html = '';
  for (const [division, items] of Object.entries(groups)) {
    // Division total row
    const divBudget = items.reduce((s, i) => s + i.total, 0);
    const divActual = items.reduce((s, i) => {
      const a = ACTUAL_DATA[i.line];
      return s + (a ? (a.coin||0)+(a.gift||0)+(a.discount||0)+(a.offline||0) : 0);
    }, 0);
    const divHasActual = items.some(i => ACTUAL_DATA[i.line]);
    const divPct = divBudget > 0 && divActual > 0 ? (divActual / divBudget * 100).toFixed(1) : '-';
    const divStatus = getStatus(divActual > 0 ? (divActual / divBudget * 100) : 0, divHasActual);
    const barWidth = Math.min(divActual > 0 ? (divActual / divBudget * 100) : 0, 100);

    html += `<tr class="division-row">
      <td class="left">${division}</td>
      <td><strong>合计</strong></td>
      <td class="amount">¥${fmt(divBudget)}</td>
      <td class="amount ${divHasActual ? (divActual > divBudget ? 'over' : 'ok') : ''}">${divHasActual ? '¥' + fmt(divActual) : '-'}</td>
      <td class="bar-cell">
        ${divHasActual ? `<div class="bar-bg"><div class="bar-fill ${divStatus.barCls}" style="width:${barWidth}%"></div></div><span class="bar-text ${divStatus.barCls}">${divPct}%</span>` : '<span style="color:var(--text-muted)">-</span>'}
      </td>
      <td><span class="status ${divStatus.cls}">${divStatus.text}</span></td>
    </tr>`;

    // Line detail rows
    for (const item of items) {
      const actual = ACTUAL_DATA[item.line];
      for (const fee of FEE_TYPES) {
        const budgetVal = item[fee.key];
        const actualVal = actual ? (actual[fee.key] || 0) : null;
        const hasActual = actualVal !== null;
        const pct = budgetVal > 0 && hasActual ? (actualVal / budgetVal * 100) : 0;
        const status = getStatus(pct, hasActual);
        const barWidth = Math.min(pct, 100);

        html += `<tr>
          <td class="left" style="padding-left:32px">${fee.key === 'total' ? '<strong>' + item.line + '</strong>' : item.line}</td>
          <td>${fee.label}</td>
          <td class="amount">¥${fmt(budgetVal)}</td>
          <td class="amount ${hasActual ? (actualVal > budgetVal ? 'over' : 'ok') : ''}">${hasActual ? '¥' + fmt(actualVal) : '-'}</td>
          <td class="bar-cell">
            ${hasActual ? `<div class="bar-bg"><div class="bar-fill ${status.barCls}" style="width:${barWidth}%"></div></div><span class="bar-text ${status.barCls}">${pct.toFixed(1)}%</span>` : '<span style="color:var(--text-muted)">-</span>'}
          </td>
          <td><span class="status ${status.cls}">${status.text}</span></td>
        </tr>`;
      }
    }
  }

  document.getElementById('tableBody').innerHTML = html;

  // Meta
  const now = new Date().toLocaleDateString('zh-CN');
  document.getElementById('metaInfo').innerHTML =
    `预算数据：2026-10-15<br>实际数据：${actualCount > 0 ? '已更新 ' + now : '待更新'}`;
}

render();
</script>
</body>
</html>
